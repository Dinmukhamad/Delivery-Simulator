                              time.sleep(0.05)
                      handles[role] = open(reports / ("city-lan-" + role + ".log"), "w")
                      env = os.environ.copy()
                      env["XDG_DATA_HOME"] = str(pathlib.Path(coord, role, "data"))
                      env["XDG_CONFIG_HOME"] = str(pathlib.Path(coord, role, "config"))
                      env["DELIVERY_TEAM_TEST_SAVE"] = "0"
                      cmd = [os.environ["GODOT_BINARY"], "--headless", "--path", "GodotDemo", "--script", "tests/lan_city_peer.gd", "--", "--test-mode", "--role=" + role, "--coord=" + coord]
                      processes[role] = subprocess.Popen(cmd, stdout=handles[role], stderr=subprocess.STDOUT, env=env)
