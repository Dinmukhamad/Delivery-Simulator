      - name: Install only required Windows and macOS templates
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, os, pathlib, shutil, urllib.request, zipfile
          archive = pathlib.Path(os.environ["RUNNER_TEMP"]) / "templates.tpz"
          urllib.request.urlretrieve("https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_export_templates.tpz", archive)
          with open(archive, "rb") as stream:
              actual = hashlib.file_digest(stream, "sha256").hexdigest()
          if actual != "3fbe2c0e2dec9d537ab9ec97bcf8da91dcf23357fc51f67092dd068d839290a8":
              raise SystemExit("Templates SHA256 mismatch")
          dest = pathlib.Path.home() / ".local/share/godot/export_templates/4.6.3.stable"
          dest.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(archive) as z:
              for member in z.namelist():
                  name = pathlib.PurePosixPath(member).name
                  if name == "macos.zip" or name == "version.txt" or "windows_release_x86_64" in name:
                      with z.open(member) as source, open(dest / name, "wb") as output:
                          shutil.copyfileobj(source, output)
                      print("Installed:", name)
          archive.unlink()
          PY
      - name: Export and check exact target packs
        shell: bash
        run: |
          python3 - <<'PY'
          import os, pathlib, struct, subprocess, zipfile
          editor = os.environ["GODOT_BINARY"]
          reports = pathlib.Path("build-reports")
          for name, output in [("Windows Desktop", "builds/Windows/DeliverySimulatorDemo.exe"), ("macOS", "builds/macOS/Delivery Simulator.zip")]:
              pathlib.Path(output).parent.mkdir(parents=True, exist_ok=True)
              result = subprocess.run([editor, "--headless", "--path", "GodotDemo", "--export-release", name, str(pathlib.Path(output).resolve())], capture_output=True, text=True, timeout=300)
              log = result.stdout + result.stderr
              (reports / (name.replace(" ", "-") + "-export.log")).write_text(log)
              print(log)
              if result.returncode or not pathlib.Path(output).is_file():
                  raise SystemExit("Export failed: " + name)
          exe = pathlib.Path("builds/Windows/DeliverySimulatorDemo.exe")
          with exe.open("rb") as stream:
              stream.seek(0x3c)
              offset = struct.unpack("<I", stream.read(4))[0]
              stream.seek(offset)
              if stream.read(4) != b"PE\x00\x00" or struct.unpack("<H", stream.read(2))[0] != 0x8664:
                  raise SystemExit("Windows build is not x86_64")
          macdir = pathlib.Path("builds/macOS/unpacked")
          with zipfile.ZipFile("builds/macOS/Delivery Simulator.zip") as z:
              z.extractall(macdir)
          pck = next(macdir.rglob("*.pck"))
          app = next(macdir.glob("*.app"))
          binary = next((app / "Contents/MacOS").iterdir())
          with binary.open("rb") as stream:
              magic, count = struct.unpack(">II", stream.read(8))
              if magic not in [0xcafebabe, 0xcafebabf]:
                  raise SystemExit("macOS build is not Universal")
              entry_size = 20 if magic == 0xcafebabe else 32
              cpus = set()
              for _ in range(count):
                  entry = stream.read(entry_size)
                  cpus.add(struct.unpack(">I", entry[:4])[0])
              if not {0x01000007, 0x0100000c}.issubset(cpus):
                  raise SystemExit("macOS Universal lacks Intel or Apple Silicon")
          script = str(pathlib.Path("GodotDemo/tests/navigation_routes.gd").resolve())
          team_script = str(pathlib.Path("GodotDemo/tests/team_shift.gd").resolve())
          for tag, pack in [("windows", exe), ("macos", pck)]:
              result = subprocess.run([editor, "--headless", "--main-pack", str(pack.resolve()), "--script", script, "--", "--test-mode"], capture_output=True, text=True, timeout=360)
              log = result.stdout + result.stderr
              (reports / (tag + "-packed-tests.log")).write_text(log)
              print(log)
              if result.returncode or "SCRIPT ERROR:" in log or "NAVIGATION_TESTS:" not in log:
                  raise SystemExit("Packed checks failed: " + tag)
              team_result = subprocess.run([editor, "--headless", "--main-pack", str(pack.resolve()), "--script", team_script, "--", "--test-mode"], capture_output=True, text=True, timeout=360)
              team_log = team_result.stdout + team_result.stderr
              (reports / (tag + "-packed-team-tests.log")).write_text(team_log)
              print(team_log)
              if team_result.returncode or "SCRIPT ERROR:" in team_log or "TEAM_SHIFT_TESTS:" not in team_log:
                  raise SystemExit("Packed Team Shift checks failed: " + tag)
              for extra, marker in [("city_layout", "CITY_LAYOUT_TESTS:"), ("city_orders", "CITY_ORDER_TESTS:"), ("district_events", "DISTRICT_EVENT_TESTS:"), ("cosmetics", "COSMETIC_TESTS:")]:
                  extra_script = str(pathlib.Path("GodotDemo/tests/" + extra + ".gd").resolve())
                  extra_result = subprocess.run([editor, "--headless", "--main-pack", str(pack.resolve()), "--script", extra_script, "--", "--test-mode"], capture_output=True, text=True, timeout=180)
                  extra_log = extra_result.stdout + extra_result.stderr
                  (reports / (tag + "-packed-" + extra + "-tests.log")).write_text(extra_log)
                  print(extra_log)
                  if extra_result.returncode or "SCRIPT ERROR:" in extra_log or marker not in extra_log:
                      raise SystemExit("Packed city checks failed: " + tag + "/" + extra)
          PY
      - name: Package downloadable game and source archives
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, shutil, zipfile
          dest = pathlib.Path("downloads")
          dest.mkdir(exist_ok=True)
          guide = """Delivery Simulator Demo 0.13.0
          Windows: unpack the archive and start DeliverySimulatorDemo.exe.
          macOS: unpack the archive and open Delivery Simulator.app.
          Controls: WASD, Mouse, Shift, Space, E, F, M (map), Tab, Esc.
          Customization: open Profile or Garage, then Appearance. Choose outfit, backpack and vehicle paint. Free styles are immediately available; other styles use earned Money. Owned styles and equipped choices are saved locally and displayed in LAN.\n          City: 516 x 516 metres, three times wider and longer. Explore the business, retail, industrial, residential and park districts; the local mini-map remains zoomed around your courier.
          LAN: Host Game on one computer; Join Game with the Host IPv4 address on the other. UDP port 7777, matching game versions, same local network.
          Map: streets and buildings match the actual city; teal route, gold pickup, teal delivery, gold dashed final walking access.
          Lunch Rush: starts 45 seconds into the shift; 3 minutes of cafe-to-office orders in the business district. Deliver before the event ends for 50% extra Money. Accepted parcels remain deliverable at normal pay after the event. Repeats after a five-minute break.\n          Team Shift: select Team mode when hosting. Complete 4 deliveries per starting player; each connected courier with a completed personal delivery receives 500 Money and 100 XP once. Tab offers/accepts parcel handoffs near a free teammate on foot.
          Native OS launch, physical Windows/macOS LAN and FPS require acceptance testing.
          Godot 4.6.3: MIT license, https://godotengine.org/license/
          Original generated audio: CC0 1.0, https://creativecommons.org/publicdomain/zero/1.0/
          """
          (pathlib.Path("builds/Windows") / "README.txt").write_text(guide)
          with zipfile.ZipFile(dest / "DeliverySimulatorDemo_Windows_v0.13.0.zip", "w", zipfile.ZIP_DEFLATED, compresslevel=6) as z:
              for p in pathlib.Path("builds/Windows").rglob("*"):
                  if p.is_file():
                      z.write(p, "DeliverySimulatorDemo_Windows_v0.13.0/" + str(p.relative_to("builds/Windows")))
          maczip = dest / "DeliverySimulatorDemo_macOS_v0.13.0.zip"
          shutil.copy2("builds/macOS/Delivery Simulator.zip", maczip)
          with zipfile.ZipFile(maczip, "a", zipfile.ZIP_DEFLATED) as z:
              z.writestr("README.txt", guide)
          with zipfile.ZipFile(dest / "DeliverySimulatorDemo_Source_v0.13.0.zip", "w", zipfile.ZIP_DEFLATED, compresslevel=6) as z:
              for p in pathlib.Path("GodotDemo").rglob("*"):
                  if p.is_file() and not any(part in [".godot", ".git", ".autoconverted", ".gdre"] for part in p.parts):
                      z.write(p, "DeliverySimulatorDemo_Source_v0.13.0/" + str(p.relative_to("GodotDemo")))
              for p in pathlib.Path("docs").rglob("*"):
                  if p.is_file():
                      z.write(p, "DeliverySimulatorDemo_Source_v0.13.0/docs/" + str(p.relative_to("docs")))
          hashes = []
          for p in sorted(dest.glob("*.zip")):
              with zipfile.ZipFile(p) as z:
                  if z.testzip() is not None:
                      raise SystemExit("ZIP CRC check failed: " + p.name)
              digest = hashlib.sha256(p.read_bytes()).hexdigest()
              hashes.append(digest + "  " + p.name)
          (dest / "SHA256SUMS.txt").write_text("\n".join(hashes) + "\n")
          report = {"version": "0.13.0", "commit": os.environ["GITHUB_SHA"], "source_tests": "passed", "windows_pack_tests": "passed", "macos_pack_tests": "passed", "lan_loopback": "passed", "team_rules_and_packs": "passed", "team_lan_and_isolated_saves": "passed", "team_visual": "passed", "expanded_city": "passed", "district_visuals": "passed", "district_events_and_packs": "passed", "district_event_lan": "passed", "district_event_visual": "passed", "customization_and_packs": "passed", "customization_lan_and_isolated_saves": "passed", "customization_visual": "passed", "visual_1280x720_960x540": "passed", "native_windows_macos": "not tested", "physical_cross_platform_lan": "not tested", "fps": "not measured"}
          pathlib.Path("build-reports/build.json").write_text(json.dumps(report, indent=2) + "\n")
          print(json.dumps(report))
          PY
