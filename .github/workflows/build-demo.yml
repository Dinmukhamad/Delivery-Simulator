      - name: Install software rendering support
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb libgl1-mesa-dri
      - name: Render both map layouts
        shell: bash
        run: |
          python3 - <<'PY'
          import os, pathlib, subprocess
          editor = os.environ["GODOT_BINARY"]
          reports = pathlib.Path("build-reports")
          for width in [1280, 960]:
              capture = str((reports / ("navigation-" + str(width) + ".png")).resolve())
              cmd = ["xvfb-run", "-a", "--server-args=-screen 0 1280x720x24", editor, "--path", "GodotDemo", "--rendering-method", "gl_compatibility", "--resolution", str(width) + "x" + str(width * 9 // 16), "--script", "tests/navigation_visual.gd", "--", "--test-mode", "--width=" + str(width), "--capture=" + capture]
              env = os.environ.copy()
              env["LIBGL_ALWAYS_SOFTWARE"] = "1"
              result = subprocess.run(cmd, capture_output=True, text=True, timeout=180, env=env)
              log = result.stdout + result.stderr
              (reports / ("visual-" + str(width) + ".log")).write_text(log)
              print(log)
              if result.returncode or "SCRIPT ERROR:" in log or "NAVIGATION_VISUAL:" not in log:
                  raise SystemExit("Map render check failed")
          PY
      - name: Capture actual Team Shift screens
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, os, pathlib, subprocess
          reports = pathlib.Path("build-reports")
          for page, width in [("game", 1280), ("orders", 1280), ("orders", 960), ("results", 1280)]:
              name = "team-" + page + "-" + str(width) + ".png"
              capture = str((reports / name).resolve())
              cmd = ["xvfb-run", "-a", "--server-args=-screen 0 1280x720x24", os.environ["GODOT_BINARY"], "--path", "GodotDemo", "--rendering-method", "gl_compatibility", "--resolution", str(width) + "x" + str(width * 9 // 16), "--script", "tests/team_visual.gd", "--", "--test-mode", "--width=" + str(width), "--screen=" + page, "--capture=" + capture]
              env = os.environ.copy()
              env["LIBGL_ALWAYS_SOFTWARE"] = "1"
              result = subprocess.run(cmd, capture_output=True, text=True, timeout=180, env=env)
              log = result.stdout + result.stderr
              (reports / ("team-visual-" + page + "-" + str(width) + ".log")).write_text(log)
              print(log)
              if result.returncode or "SCRIPT ERROR:" in log or "TEAM_VISUAL:" not in log:
                  raise SystemExit("Team render check failed")
              encoded = base64.b64encode(pathlib.Path(capture).read_bytes()).decode("ascii")
              print("SCREENSHOT_BEGIN " + name)
              for offset in range(0, len(encoded), 4000):
                  print("SCREENSHOT_DATA " + encoded[offset:offset + 4000])
              print("SCREENSHOT_END " + name)
          PY
