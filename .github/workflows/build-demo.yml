name: Validate and build Delivery Simulator

on:
  push:
    branches: [develop]
    paths: [GodotDemo/**, .github/workflows/build-demo.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: delivery-demo-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install verified Godot 4.6.3
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, os, pathlib, urllib.request, zipfile
          target = pathlib.Path(os.environ["RUNNER_TEMP"]) / "godot"
          target.mkdir(exist_ok=True)
          archive = target / "editor.zip"
          urllib.request.urlretrieve("https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip", archive)
          with open(archive, "rb") as stream:
              actual = hashlib.file_digest(stream, "sha256").hexdigest()
          if actual != "d0bc2113065e481c9c2c2b2c37daa4e8be3fe9e27f0ab9ab0b6096e9a37907f3":
              raise SystemExit("Editor SHA256 mismatch")
          with zipfile.ZipFile(archive) as z:
              z.extractall(target)
          editor = next(target.glob("Godot_*x86_64"))
          editor.chmod(0o755)
          with open(os.environ["GITHUB_ENV"], "a") as stream:
              stream.write("GODOT_BINARY=" + str(editor) + "\n")
          PY
      - name: Import and validate GDScript
        shell: bash
        run: |
          mkdir -p build-reports
          python3 - <<'PY'
          import os, pathlib, subprocess
          result = subprocess.run([os.environ["GODOT_BINARY"], "--headless", "--editor", "--path", "GodotDemo", "--quit"], capture_output=True, text=True, timeout=360)
          output = result.stdout + result.stderr
          pathlib.Path("build-reports/editor-import.log").write_text(output)
          print(output)
          if result.returncode or any(s in output for s in ["SCRIPT ERROR:", "Parse Error:", "Failed to load script", "Failed loading resource"]):
              raise SystemExit("Editor import failed")
          PY
      - name: Run navigation and Solo regression checks
        shell: bash
        run: |
          python3 - <<'PY'
          import os, pathlib, subprocess
          result = subprocess.run([os.environ["GODOT_BINARY"], "--headless", "--path", "GodotDemo", "--script", "tests/navigation_routes.gd", "--", "--test-mode"], capture_output=True, text=True, timeout=360)
          output = result.stdout + result.stderr
          pathlib.Path("build-reports/navigation-tests.log").write_text(output)
          print(output)
          if result.returncode or "SCRIPT ERROR:" in output or "NAVIGATION_TESTS:" not in output:
              raise SystemExit("Navigation checks failed")
          PY
      - name: Verify expanded city and delivery generation
        shell: bash
        run: |
          python3 - <<'PY'
          import os, pathlib, subprocess
          for name, marker in [("city_layout", "CITY_LAYOUT_TESTS:"), ("city_orders", "CITY_ORDER_TESTS:")]:
              result = subprocess.run([os.environ["GODOT_BINARY"], "--headless", "--path", "GodotDemo", "--script", "tests/" + name + ".gd", "--", "--test-mode"], capture_output=True, text=True, timeout=180)
              output = result.stdout + result.stderr
              pathlib.Path("build-reports/" + name + "-tests.log").write_text(output)
              print(output)
              if result.returncode or "SCRIPT ERROR:" in output or marker not in output:
                  raise SystemExit("Expanded city checks failed: " + name)
          PY
      - name: Verify Team Shift server rules
        shell: bash
        run: |
          python3 - <<'PY'
          import os, pathlib, subprocess
          result = subprocess.run([os.environ["GODOT_BINARY"], "--headless", "--path", "GodotDemo", "--script", "tests/team_shift.gd", "--", "--test-mode"], capture_output=True, text=True, timeout=360)
          output = result.stdout + result.stderr
          pathlib.Path("build-reports/team-tests.log").write_text(output)
          print(output)
          if result.returncode or "SCRIPT ERROR:" in output or "TEAM_SHIFT_TESTS:" not in output:
              raise SystemExit("Team Shift checks failed")
          PY
      - name: Verify district event timing and rewards
        shell: bash
        run: |
          python3 - <<'PY'
          import os, pathlib, subprocess
          result = subprocess.run([os.environ["GODOT_BINARY"], "--headless", "--path", "GodotDemo", "--script", "tests/district_events.gd", "--", "--test-mode"], capture_output=True, text=True, timeout=360)
          output = result.stdout + result.stderr
          pathlib.Path("build-reports/district-events-tests.log").write_text(output)
          print(output)
          if result.returncode or "SCRIPT ERROR:" in output or "DISTRICT_EVENT_TESTS:" not in output:
              raise SystemExit("District event checks failed")
          PY
      - name: Verify customization and profile compatibility
        shell: bash
        run: |
          python3 - <<'PY'
          import os, pathlib, subprocess
          result = subprocess.run([os.environ["GODOT_BINARY"], "--headless", "--path", "GodotDemo", "--script", "tests/cosmetics.gd", "--", "--test-mode"], capture_output=True, text=True, timeout=360)
          output = result.stdout + result.stderr
          pathlib.Path("build-reports/cosmetics-tests.log").write_text(output)
          print(output)
          if result.returncode or "SCRIPT ERROR:" in output or "COSMETIC_TESTS:" not in output:
              raise SystemExit("Customization checks failed")
          PY
      - name: Verify two-process LAN navigation
        shell: bash
        run: |
          python3 - <<'PY'
          import os, pathlib, subprocess, tempfile, time
          editor = os.environ["GODOT_BINARY"]
          reports = pathlib.Path("build-reports")
          with tempfile.TemporaryDirectory() as coord:
              handles = {}
              processes = {}
              try:
                  for role in ["host", "client"]:
                      if role == "client":
                          deadline = time.monotonic() + 20
                          while not pathlib.Path(coord, "host-ready").exists():
                              if time.monotonic() > deadline or processes["host"].poll() is not None:
                                  raise RuntimeError("Host did not open lobby")
                              time.sleep(0.05)
                      handles[role] = open(reports / ("lan-" + role + ".log"), "w")
                      cmd = [editor, "--headless", "--path", "GodotDemo", "--script", "tests/lan_navigation_peer.gd", "--", "--test-mode", "--role=" + role, "--coord=" + coord]
                      processes[role] = subprocess.Popen(cmd, stdout=handles[role], stderr=subprocess.STDOUT)
                  for role in ["client", "host"]:
                      result = processes[role].wait(timeout=45)
                      handles[role].flush()
                      log = (reports / ("lan-" + role + ".log")).read_text()
                      print(log)
                      if result or "SCRIPT ERROR:" in log or "LAN_NAVIGATION_" not in log:
                          raise RuntimeError("LAN checks failed: " + role)
              finally:
                  for process in processes.values():
                      if process.poll() is None:
                          process.kill()
                          process.wait()
                  for handle in handles.values():
                      handle.close()
                  for role in handles:
                      print("PEER_LOG " + role + "\\n" + (reports / ("lan-" + role + ".log")).read_text())
          PY
      - name: Verify cooperative LAN and isolated profile saves
        shell: bash
        run: |
          python3 - <<'PY'
          import os, pathlib, subprocess, tempfile, time
          reports = pathlib.Path("build-reports")
          with tempfile.TemporaryDirectory() as coord:
              handles, processes = {}, {}
              try:
                  for role in ["host", "client"]:
                      if role == "client":
                          deadline = time.monotonic() + 20
                          while not pathlib.Path(coord, "host-ready").exists():
                              if time.monotonic() > deadline or processes["host"].poll() is not None:
                                  raise RuntimeError("Team Host did not open lobby")
                              time.sleep(0.05)
                      handles[role] = open(reports / ("team-lan-" + role + ".log"), "w")
                      env = os.environ.copy()
                      env["XDG_DATA_HOME"] = str(pathlib.Path(coord, role, "data"))
                      env["XDG_CONFIG_HOME"] = str(pathlib.Path(coord, role, "config"))
                      env["DELIVERY_TEAM_TEST_SAVE"] = "1"
                      cmd = [os.environ["GODOT_BINARY"], "--headless", "--path", "GodotDemo", "--script", "tests/lan_team_peer.gd", "--", "--test-mode", "--isolated-save", "--role=" + role, "--coord=" + coord]
                      processes[role] = subprocess.Popen(cmd, stdout=handles[role], stderr=subprocess.STDOUT, env=env)
                  for role in ["client", "host"]:
                      code = processes[role].wait(timeout=75)
                      handles[role].flush()
                      log = (reports / ("team-lan-" + role + ".log")).read_text()
                      print(log)
                      if code or "SCRIPT ERROR:" in log or "LAN_TEAM_" not in log:
                          raise RuntimeError("Cooperative LAN checks failed: " + role)
              finally:
                  for process in processes.values():
                      if process.poll() is None:
                          process.kill()
                          process.wait()
                  for handle in handles.values():
                      handle.close()
                  for role in handles:
                      print("TEAM_PEER_LOG " + role + "\\n" + (reports / ("team-lan-" + role + ".log")).read_text())
          PY
      - name: Verify LAN delivery beyond former city boundary
        shell: bash
